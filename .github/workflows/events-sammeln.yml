name: Events sammeln (nachts)

on:
  schedule:
    # Zeiten in UTC. GitHub lässt geplante Läufe manchmal ausfallen,
    # darum ein Ersatz-Termin, der sich selbst überspringt, wenn schon gesammelt wurde.
    - cron: "23 1 * * *" # ca. 2:23 Uhr (Winterzeit)
    - cron: "47 3 * * *" # Ersatz: ca. 4:47 Uhr
  workflow_dispatch: {} # per Knopfdruck auf GitHub startbar

concurrency:
  group: events-sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    # Ganz Österreich: der erste Lauf dauert lange (viele neue Orte), danach deutlich kürzer.
    # Der Sammler hört selbst nach MAX_MINUTEN auf, neue Quellen anzufangen.
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      TZ: Europe/Vienna
      MAX_MINUTEN: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Datenbank aktualisieren
        run: node scripts/migrate.mjs
      - name: Events sammeln
        run: node pipeline/lauf.ts ${{ github.event_name == 'schedule' && '--nur-falls-noetig' || '' }}
